<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PairLink</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f6f8;color:#15171a}
body{display:flex;justify-content:center}
.app{width:100%;max-width:760px;height:100dvh;background:#fff;display:flex;flex-direction:column}
.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #e7e8eb}
.brand{font-size:19px;font-weight:750}
.status{font-size:12px;color:#8a9099}
.share{border:0;background:#15171a;color:#fff;border-radius:18px;padding:8px 13px;font-size:13px;font-weight:650}
#messages{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:9px}
.bubble{max-width:78%;padding:10px 13px;border-radius:17px;font-size:15px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.mine{align-self:flex-end;background:#15171a;color:#fff;border-bottom-right-radius:5px}
.theirs{align-self:flex-start;background:#eef0f3;color:#15171a;border-bottom-left-radius:5px}
.empty{margin:auto;text-align:center;color:#9aa0a8;font-size:14px;padding:20px}
.bottom{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #e7e8eb;display:flex;gap:8px}
#text{min-width:0;flex:1;border:1px solid #dfe2e7;border-radius:22px;padding:11px 15px;font-size:16px;outline:none}
#send{border:0;border-radius:22px;padding:0 18px;background:#15171a;color:#fff;font-weight:650}
.notice{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#15171a;color:#fff;padding:9px 13px;border-radius:10px;font-size:13px;display:none;z-index:5}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <div class="brand">PairLink</div>
      <div class="status" id="status">Connecting…</div>
    </div>
    <button class="share" id="share">Share Link</button>
  </div>

  <div id="messages">
    <div class="empty" id="empty">Waiting for the other person…</div>
  </div>

  <form class="bottom" id="form">
    <input id="text" autocomplete="off" placeholder="Message…" disabled>
    <button id="send" type="submit" disabled>Send</button>
  </form>
</div>
<div class="notice" id="notice"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const statusEl = document.getElementById("status");
const messagesEl = document.getElementById("messages");
const emptyEl = document.getElementById("empty");
const input = document.getElementById("text");
const form = document.getElementById("form");
const send = document.getElementById("send");
const share = document.getElementById("share");
const notice = document.getElementById("notice");

let peer, conn;
const targetId = location.hash.slice(1);

function showNotice(text){
  notice.textContent=text;
  notice.style.display="block";
  clearTimeout(showNotice.t);
  showNotice.t=setTimeout(()=>notice.style.display="none",1800);
}

function addMessage(text, mine){
  emptyEl.style.display="none";
  const div=document.createElement("div");
  div.className="bubble "+(mine?"mine":"theirs");
  div.textContent=text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop=messagesEl.scrollHeight;
}

function ready(c){
  conn=c;
  statusEl.textContent="Connected";
  input.disabled=false;
  send.disabled=false;
  input.focus();

  conn.on("data", data=>{
    if(typeof data==="string") addMessage(data,false);
  });

  conn.on("close",()=>{
    statusEl.textContent="Disconnected";
    input.disabled=true;
    send.disabled=true;
  });

  conn.on("error",()=>{
    statusEl.textContent="Connection error";
  });
}

function createPeer(){
  peer = new Peer();

  peer.on("open", id=>{
    if(!targetId){
      history.replaceState(null,"",location.pathname+"#"+id);
      statusEl.textContent="Ready — share this link";
      emptyEl.textContent="Share this link with someone to start chatting.";
    } else {
      statusEl.textContent="Connecting…";
      const c=peer.connect(targetId,{reliable:true});
      c.on("open",()=>ready(c));
      c.on("error",()=>{statusEl.textContent="Could not connect";});
    }
  });

  peer.on("connection", c=>{
    if(!conn) ready(c);
  });

  peer.on("error", err=>{
    console.error(err);
    if(err.type==="peer-unavailable"){
      statusEl.textContent="Chat not available";
      emptyEl.textContent="The other person is offline or the link has expired.";
    } else {
      statusEl.textContent="Connection error";
    }
  });
}

share.onclick=async()=>{
  const url=location.href;
  try{
    if(navigator.share) await navigator.share({title:"PairLink Chat",url});
    else {
      await navigator.clipboard.writeText(url);
      showNotice("Chat link copied");
    }
  }catch(e){}
};

form.addEventListener("submit",e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text || !conn || !conn.open) return;
  conn.send(text);
  addMessage(text,true);
  input.value="";
  input.focus();
});

createPeer();
</script>
</body>
</html>
